<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Curso de Ética Profesional</title>
    <meta name="description" content="Curso virtual de Ética Profesional para las personas que se incorporan al Colegio de Ciencias Económicas de Costa Rica." />
    <meta name="theme-color" content="#18171f" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/estilos.css" />
  </head>
  <body>
    <a class="saltar" href="#pista">Saltar al contenido</a>

    <header class="cabecera">
      <button id="btn-indice" class="btn-redondo" type="button" aria-haspopup="dialog" aria-controls="indice" aria-label="Índice del curso">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z" /></svg>
        <span class="solo-lector">Índice del curso</span>
      </button>
      <div class="cabecera-texto">
        <p class="cabecera-curso">Curso de Ética Profesional</p>
        <h1 id="titulo-seccion" class="cabecera-seccion"></h1>
      </div>
      <nav class="flechas" aria-label="Pasos">
        <button id="btn-arriba" class="flecha" type="button" aria-label="Paso anterior">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7l-7 7 1.4 1.4L12 9.8l5.6 5.6L19 14z" /></svg>
        </button>
        <button id="btn-abajo" class="flecha" type="button" aria-label="Paso siguiente">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path id="ico-abajo" d="M12 17l7-7-1.4-1.4L12 14.2 6.4 8.6 5 10z" /></svg>
        </button>
      </nav>
      <div id="barras" class="barras" role="img"></div>
    </header>

    <main id="app" class="app">
      <div id="pista" class="pista" tabindex="-1"></div>
    </main>

    <div class="controles">
      <div id="rail" class="rail">
        <button id="btn-leer" class="accion" type="button" aria-haspopup="dialog" aria-controls="panel" aria-label="Leer">
          <span class="accion-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 5c-1.1-.35-2.3-.5-3.5-.5-1.95 0-4.05.4-5.5 1.5-1.45-1.1-3.55-1.5-5.5-1.5S2.45 4.9 1 6v14.65c0 .25.25.5.5.5.1 0 .15-.05.25-.05C3.1 20.45 5.05 20 6.5 20c1.95 0 4.05.4 5.5 1.5 1.35-.85 3.8-1.5 5.5-1.5 1.65 0 3.35.3 4.75 1.05.1.05.15.05.25.05.25 0 .5-.25.5-.5V6c-.6-.45-1.25-.75-2-1zm0 13.5c-1.1-.35-2.3-.5-3.5-.5-1.7 0-4.15.65-5.5 1.5V8c1.35-.85 3.8-1.5 5.5-1.5 1.2 0 2.4.15 3.5.5v11.5z" /></svg></span>
          <span class="accion-txt">Leer</span>
        </button>
        <button id="btn-trans" class="accion" type="button" aria-haspopup="dialog" aria-controls="panel" aria-label="Transcripción del video">
          <span class="accion-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v2H4zm0 4h16v2H4zm0 4h10v2H4zm0 4h13v2H4z" /></svg></span>
          <span class="accion-txt">Transcripción</span>
        </button>
        <button id="btn-sonido" class="accion" type="button" aria-pressed="false">
          <span class="accion-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="ico-sonido" d="" /></svg></span>
          <span class="accion-txt" id="txt-sonido">Sonido</span>
        </button>
        <button id="btn-cc" class="accion" type="button" aria-pressed="true">
          <span class="accion-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm-8 7H9.5v-.5h-2v3h2V13H11v1a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v1zm7 0h-1.5v-.5h-2v3h2V13H18v1a1 1 0 0 1-1 1h-3a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v1z" /></svg></span>
          <span class="accion-txt">Subtítulos</span>
        </button>
      </div>
    </div>

    <button id="aviso-sonido" class="aviso-sonido" type="button" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.47 4.47 0 0 0 2.5-4z" /></svg>
      Toca para activar el sonido
    </button>

    <dialog id="panel" class="panel" aria-labelledby="panel-titulo">
      <div class="panel-cab">
        <h2 id="panel-titulo"></h2>
        <button id="panel-cerrar" class="btn-redondo claro" type="button" aria-label="Cerrar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z" /></svg>
          <span class="solo-lector">Cerrar</span>
        </button>
      </div>
      <div id="panel-cuerpo" class="panel-cuerpo"></div>
    </dialog>

    <dialog id="indice" class="panel" aria-labelledby="indice-titulo">
      <div class="panel-cab">
        <h2 id="indice-titulo">Índice del curso</h2>
        <button id="indice-cerrar" class="btn-redondo claro" type="button" aria-label="Cerrar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z" /></svg>
          <span class="solo-lector">Cerrar</span>
        </button>
      </div>
      <div class="panel-cuerpo">
        <ol id="indice-lista" class="indice-lista"></ol>
        <details class="atajos">
          <summary>Atajos de teclado</summary>
          <ul>
            <li><kbd>↓</kbd> / <kbd>↑</kbd>: paso siguiente o anterior</li>
            <li><kbd>Espacio</kbd>: reproducir o pausar el video</li>
            <li><kbd>Tab</kbd>: recorrer los botones (sonido, subtítulos, leer, transcripción)</li>
            <li><kbd>Esc</kbd>: cerrar un panel</li>
          </ul>
        </details>
        <button id="btn-reiniciar" class="boton" type="button">Reiniciar mi avance</button>
      </div>
    </dialog>

    <div id="vivo" class="solo-lector" aria-live="polite"></div>

    <noscript><p class="sin-js">Este curso necesita JavaScript activado para funcionar.</p></noscript>

    <script src="js/curso.js"></script>
    <script src="js/transcripciones.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
